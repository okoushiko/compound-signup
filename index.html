<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Compound — 24-hour fintech hackathon for high schoolers</title>
<meta name="description" content="Compound is a 24-hour virtual fintech hackathon for high school students, run by DevFintech." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEEBF6;
    --ink:#171436;
    --indigo:#4A37F0;
    --gold:#F4A83A;
    --card:#FFFFFF;
    --muted:#6B6790;
    --line:#DAD5EC;
    --error:#C6285A;

    --display:"Bricolage Grotesque","Helvetica Neue",sans-serif;
    --body:"Instrument Sans",-apple-system,BlinkMacSystemFont,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;

    --r:14px;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--body);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 20px;
  }

  /* soft ambient wash so the paper isn't flat */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(60% 45% at 15% 0%, rgba(74,55,240,.10), transparent 70%),
      radial-gradient(50% 40% at 95% 100%, rgba(244,168,58,.14), transparent 70%);
    pointer-events:none;
    z-index:0;
  }

  .shell{
    position:relative;
    z-index:1;
    width:100%;
    max-width:620px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--r);
    padding:34px 38px 30px;
    box-shadow:0 1px 2px rgba(23,20,54,.04), 0 18px 44px -22px rgba(23,20,54,.28);
  }

  /* ---------- signature: the compounding curve ---------- */
  .meter{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:30px;
  }
  .curve-wrap{flex:1;min-width:0}
  .curve{display:block;width:100%;height:44px;overflow:visible}
  .curve-track{
    fill:none;
    stroke:var(--line);
    stroke-width:2;
    stroke-linecap:round;
  }
  .curve-live{
    fill:none;
    stroke:var(--indigo);
    stroke-width:2.5;
    stroke-linecap:round;
    transition:stroke-dashoffset .55s cubic-bezier(.22,.8,.3,1);
  }
  .curve-dot{
    fill:var(--gold);
    stroke:var(--card);
    stroke-width:2.5;
    transition:transform .55s cubic-bezier(.22,.8,.3,1);
  }
  .step-count{
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:.04em;
    color:var(--muted);
    white-space:nowrap;
  }

  /* ---------- type ---------- */
  .eyebrow{
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:.13em;
    text-transform:uppercase;
    color:var(--indigo);
    margin-bottom:16px;
  }
  h1{
    font-family:var(--display);
    font-weight:800;
    font-size:clamp(48px,11vw,76px);
    line-height:.92;
    letter-spacing:-.035em;
    margin-bottom:18px;
  }
  h2{
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(23px,5vw,29px);
    line-height:1.14;
    letter-spacing:-.02em;
    margin-bottom:8px;
  }
  .lede{color:var(--muted);font-size:16.5px;margin-bottom:26px;max-width:46ch}
  .hint{color:var(--muted);font-size:14.5px;margin-bottom:24px;max-width:46ch}

  .facts{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:30px;
  }
  .fact{
    font-family:var(--mono);
    font-size:12px;
    padding:6px 11px;
    border:1px solid var(--line);
    border-radius:100px;
    color:var(--ink);
  }
  .fact.pending{color:var(--muted);border-style:dashed}

  /* ---------- options ---------- */
  .opts{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
  .opt{
    display:block;
    width:100%;
    text-align:left;
    font-family:var(--body);
    font-size:16px;
    color:var(--ink);
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:11px;
    padding:15px 17px;
    cursor:pointer;
    transition:border-color .16s, background .16s, transform .16s;
  }
  .opt:hover{border-color:#B9AFE4;transform:translateY(-1px)}
  .opt small{display:block;color:var(--muted);font-size:14px;margin-top:3px}
  .opt[aria-pressed="true"]{
    border-color:var(--indigo);
    background:rgba(74,55,240,.045);
  }
  .opt[aria-pressed="true"] .tick{opacity:1}
  .opt .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .tick{
    opacity:0;
    flex:none;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--indigo);
    display:grid;place-items:center;
    transition:opacity .16s;
  }
  .tick::after{
    content:"";
    width:8px;height:4.5px;
    border-left:2px solid #fff;
    border-bottom:2px solid #fff;
    transform:rotate(-45deg) translate(1px,-1px);
  }

  /* ---------- fields ---------- */
  .field{margin-bottom:18px}
  label{
    display:block;
    font-size:13.5px;
    font-weight:600;
    letter-spacing:.01em;
    margin-bottom:7px;
  }
  input[type=text],input[type=email],select,textarea{
    width:100%;
    font-family:var(--body);
    font-size:16px;
    color:var(--ink);
    background:#FBFAFE;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    transition:border-color .16s, background .16s;
  }
  textarea{resize:vertical;min-height:88px;line-height:1.45}
  select{appearance:none;cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236B6790' stroke-width='1.8' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;padding-right:38px}
  input:focus,select:focus,textarea:focus{
    outline:none;
    border-color:var(--indigo);
    background:#fff;
  }
  ::placeholder{color:#A9A4C4}

  .err{
    display:none;
    font-size:13.5px;
    color:var(--error);
    margin-top:7px;
  }
  .err.show{display:block}
  .field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--error)}

  /* ---------- nav ---------- */
  .nav{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:28px;
    padding-top:22px;
    border-top:1px solid var(--line);
  }
  .btn{
    font-family:var(--body);
    font-size:15.5px;
    font-weight:600;
    border-radius:10px;
    padding:13px 24px;
    cursor:pointer;
    border:1.5px solid transparent;
    transition:background .16s, transform .16s, border-color .16s;
  }
  .btn-primary{background:var(--indigo);color:#fff}
  .btn-primary:hover{background:#3A29CE;transform:translateY(-1px)}
  .btn-primary[disabled]{opacity:.5;cursor:not-allowed;transform:none}
  .btn-ghost{background:transparent;color:var(--muted);border-color:var(--line);padding:13px 18px}
  .btn-ghost:hover{color:var(--ink);border-color:#B9AFE4}
  .spacer{flex:1}

  /* ---------- review ---------- */
  .summary{border-top:1px solid var(--line);margin-bottom:6px}
  .srow{
    display:flex;
    gap:16px;
    padding:13px 0;
    border-bottom:1px solid var(--line);
    font-size:15px;
  }
  .skey{
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--muted);
    width:140px;
    flex:none;
    padding-top:3px;
  }
  .sval{flex:1;min-width:0;word-break:break-word}

  /* ---------- done ---------- */
  .done h2{margin-bottom:10px}
  .badge{
    width:52px;height:52px;
    border-radius:50%;
    background:var(--gold);
    display:grid;place-items:center;
    margin-bottom:20px;
  }
  .badge::after{
    content:"";
    width:17px;height:9px;
    border-left:2.5px solid var(--ink);
    border-bottom:2.5px solid var(--ink);
    transform:rotate(-45deg) translate(1px,-2px);
  }

  .footnote{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--muted);
    text-align:center;
    margin-top:18px;
    letter-spacing:.02em;
  }

  /* screen transition */
  .screen{animation:rise .34s cubic-bezier(.22,.8,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  :focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:6px}

  @media (max-width:560px){
    .card{padding:26px 22px 24px}
    .skey{width:100px}
    .nav{flex-wrap:wrap}
    .btn{flex:1;text-align:center}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>

<div class="shell">
  <div class="card" id="card"></div>
  <p class="footnote">Compound &middot; organized by DevFintech</p>
</div>

<script>
/* ------------------------------------------------------------------
   WHERE SIGNUPS GO
   Leave blank to test — submissions log to the browser console.
   Set to your Supabase / Formspree / Apps Script endpoint to go live.
------------------------------------------------------------------- */
const SUBMIT_ENDPOINT = "";

const state = {
  role:null, school:"", grade:"", experience:"", tier:"",
  org:"", expertise:[],
  hasTeam:null, teamName:"", teammates:"", matching:null,
  name:"", email:""
};

const EXPERTISE = ["Fintech & APIs","Machine learning","Product design","Backend & databases","Pitching & demos","Business models"];

/* ordered steps, recomputed as answers come in */
function steps(){
  const s = ["intro","role"];
  if(state.role === "student"){
    s.push("school","experience","tier","team");
    s.push(state.hasTeam === true ? "teamdetails" : "matching");
  } else if(state.role === "mentor"){
    s.push("org","expertise");
  }
  if(state.role) s.push("contact","review");
  return s;
}

let idx = 0;
const card = document.getElementById("card");

/* ---------- the compounding curve ---------- */
const CURVE_D = "M4,40 C60,39 108,35 148,27 S222,7 296,3";

function meter(){
  const list = steps();
  const total = list.length - 1;          // intro isn't a question
  const done  = Math.max(0, idx);
  const p     = total ? done/total : 0;
  return `
  <div class="meter">
    <div class="curve-wrap">
      <svg class="curve" viewBox="0 0 300 44" preserveAspectRatio="none" aria-hidden="true">
        <path class="curve-track" d="${CURVE_D}" />
        <path class="curve-live" id="live" d="${CURVE_D}" pathLength="1"
              stroke-dasharray="1" stroke-dashoffset="${1-p}" />
        <circle class="curve-dot" id="dot" r="4.5" cx="0" cy="0" />
      </svg>
    </div>
    <span class="step-count">${done} / ${total}</span>
  </div>`;
}

function placeDot(){
  const live = document.getElementById("live");
  const dot  = document.getElementById("dot");
  if(!live || !dot) return;
  const list  = steps();
  const total = list.length - 1;
  const p     = total ? Math.max(0, idx)/total : 0;
  const len   = live.getTotalLength();
  const pt    = live.getPointAtLength(len * p);
  dot.setAttribute("cx", pt.x);
  dot.setAttribute("cy", pt.y);
  dot.style.opacity = p > 0 ? 1 : 0;
}

/* ---------- small builders ---------- */
const opt = (val, key, title, sub) => `
  <button class="opt" data-key="${key}" data-val="${val}" aria-pressed="${state[key]===val || (Array.isArray(state[key]) && state[key].includes(val))}">
    <span class="row">
      <span>${title}${sub ? `<small>${sub}</small>` : ""}</span>
      <span class="tick"></span>
    </span>
  </button>`;

const field = (id, label, html) => `
  <div class="field" id="f-${id}">
    <label for="${id}">${label}</label>
    ${html}
    <p class="err" id="e-${id}"></p>
  </div>`;

const nav = (primary="Continue", canBack=true) => `
  <div class="nav">
    ${canBack ? `<button class="btn btn-ghost" id="back">Back</button>` : ""}
    <span class="spacer"></span>
    <button class="btn btn-primary" id="next">${primary}</button>
  </div>`;

/* ---------- screens ---------- */
const screens = {
  intro: () => `
    <div class="screen">
      <p class="eyebrow">DevFintech presents</p>
      <h1>Compound</h1>
      <p class="lede">Twenty-four hours to build something that makes money make sense. Open to any high school student, anywhere.</p>
      <div class="facts">
        <span class="fact">Virtual</span>
        <span class="fact">24 hours</span>
        <span class="fact">Free to enter</span>
        <span class="fact pending">Dates announced soon</span>
      </div>
      <div class="nav">
        <span class="spacer"></span>
        <button class="btn btn-primary" id="next">Sign up</button>
      </div>
    </div>`,

  role: () => `
    <div class="screen">
      <h2>First — which one are you?</h2>
      <p class="hint">This changes what we ask next.</p>
      <div class="opts">
        ${opt("student","role","I want to build","Compete solo or on a team of up to four")}
        ${opt("mentor","role","I want to help","Mentor teams or judge final submissions")}
      </div>
      ${nav()}
    </div>`,

  school: () => `
    <div class="screen">
      <h2>Where do you go to school?</h2>
      <p class="hint">Used to group teams by region and confirm eligibility.</p>
      ${field("school","School name",`<input type="text" id="school" value="${state.school}" placeholder="Archbishop Mitty High School" autocomplete="off">`)}
      ${field("grade","Grade this fall",`
        <select id="grade">
          <option value="">Select a grade</option>
          ${["9th","10th","11th","12th"].map(g=>`<option ${state.grade===g?"selected":""}>${g}</option>`).join("")}
        </select>`)}
      ${nav()}
    </div>`,

  experience: () => `
    <div class="screen">
      <h2>How many hackathons have you done?</h2>
      <p class="hint">No wrong answer — we run a beginner track either way.</p>
      <div class="opts">
        ${opt("first","experience","This would be my first")}
        ${opt("some","experience","One or two")}
        ${opt("lots","experience","Three or more")}
      </div>
      ${nav()}
    </div>`,

  tier: () => `
    <div class="screen">
      <h2>Which track are you interested in?</h2>
      <p class="hint">You can change this later — nothing is locked until judging opens.</p>
      <div class="opts">
        ${opt("beginner","tier","Beginner","Workshops throughout, judged against other first-timers")}
        ${opt("open","tier","Open","Any experience level, full prize pool")}
        ${opt("advanced","tier","Advanced","Harder problem set, judged on technical depth")}
        ${opt("undecided","tier","Not sure yet","We'll ask again closer to the event")}
      </div>
      ${nav()}
    </div>`,

  team: () => `
    <div class="screen">
      <h2>Do you already have a team?</h2>
      <p class="hint">Teams can have up to four people. Solo entries are welcome too.</p>
      <div class="opts">
        ${opt(true,"hasTeam","Yes, I have a team")}
        ${opt(false,"hasTeam","Not yet")}
      </div>
      ${nav()}
    </div>`,

  teamdetails: () => `
    <div class="screen">
      <h2>Tell us about your team</h2>
      <p class="hint">Teammates get their own signup link so they only fill this out once.</p>
      ${field("teamName","Team name",`<input type="text" id="teamName" value="${state.teamName}" placeholder="Pick anything — you can change it later">`)}
      ${field("teammates","Teammate emails",`<textarea id="teammates" placeholder="One per line">${state.teammates}</textarea>`)}
      ${nav()}
    </div>`,

  matching: () => `
    <div class="screen">
      <h2>Want us to match you with a team?</h2>
      <p class="hint">We pair people by interest and experience the week before the event.</p>
      <div class="opts">
        ${opt(true,"matching","Yes, match me with a team")}
        ${opt(false,"matching","No, I'll compete solo")}
      </div>
      ${nav()}
    </div>`,

  org: () => `
    <div class="screen">
      <h2>What do you do?</h2>
      <p class="hint">Shown to students when they pick mentors during the event.</p>
      ${field("org","Company or role",`<input type="text" id="org" value="${state.org}" placeholder="Software engineer at Stripe">`)}
      ${nav()}
    </div>`,

  expertise: () => `
    <div class="screen">
      <h2>What can you help with?</h2>
      <p class="hint">Pick as many as apply.</p>
      <div class="opts">
        ${EXPERTISE.map(e=>opt(e,"expertise",e)).join("")}
      </div>
      ${nav()}
    </div>`,

  contact: () => `
    <div class="screen">
      <h2>Last thing — how do we reach you?</h2>
      <p class="hint">One confirmation email now, one reminder before the event. Nothing else.</p>
      ${field("name","Full name",`<input type="text" id="name" value="${state.name}" autocomplete="name">`)}
      ${field("email","Email",`<input type="email" id="email" value="${state.email}" placeholder="you@example.com" autocomplete="email">`)}
      ${nav("Review")}
    </div>`,

  review: () => {
    const rows = [
      ["Role", state.role === "student" ? "Student" : "Mentor or judge"],
      ["Name", state.name],
      ["Email", state.email]
    ];
    if(state.role === "student"){
      rows.push(["School", `${state.school} · ${state.grade}`]);
      rows.push(["Experience", {first:"First hackathon",some:"One or two",lots:"Three or more"}[state.experience]]);
      rows.push(["Track", `${{beginner:"Beginner",open:"Open",advanced:"Advanced",undecided:"Undecided"}[state.tier]} <span style="color:var(--muted)">— changeable later</span>`]);
      if(state.hasTeam){
        rows.push(["Team", state.teamName]);
        const n = state.teammates.split(/[\n,]/).map(s=>s.trim()).filter(Boolean).length;
        rows.push(["Teammates", n ? `${n} invited` : "None listed"]);
      } else {
        rows.push(["Team", state.matching ? "Match me with a team" : "Competing solo"]);
      }
    } else {
      rows.push(["Role detail", state.org]);
      rows.push(["Can help with", state.expertise.join(", ") || "Not specified"]);
    }
    return `
    <div class="screen">
      <h2>Check this over</h2>
      <p class="hint">Go back and change anything that looks wrong.</p>
      <div class="summary">
        ${rows.map(([k,v])=>`<div class="srow"><span class="skey">${k}</span><span class="sval">${v}</span></div>`).join("")}
      </div>
      ${nav("Submit signup")}
    </div>`;
  },

  done: () => `
    <div class="screen done">
      <div class="badge"></div>
      <h2>You're in.</h2>
      <p class="lede">A confirmation is on its way to <strong>${state.email}</strong>. We'll email the schedule and the Discord invite once dates are locked.</p>
      <div class="facts"><span class="fact">Signup received</span></div>
    </div>`
};

/* ---------- validation ---------- */
function fail(id, msg){
  const f = document.getElementById("f-"+id);
  const e = document.getElementById("e-"+id);
  if(f) f.classList.add("invalid");
  if(e){ e.textContent = msg; e.classList.add("show"); }
  return false;
}
function clearErrors(){
  document.querySelectorAll(".field").forEach(f=>f.classList.remove("invalid"));
  document.querySelectorAll(".err").forEach(e=>e.classList.remove("show"));
}

function validate(step){
  clearErrors();
  const v = id => (document.getElementById(id)?.value || "").trim();

  if(step === "role")       return state.role ? true : fail("", "") || alertPick("Pick one to continue.");
  if(step === "experience") return state.experience ? alertPickClear() : alertPick("Pick one to continue.");
  if(step === "tier")       return state.tier ? alertPickClear() : alertPick("Pick a track — you can change it later.");
  if(step === "team")       return state.hasTeam !== null ? alertPickClear() : alertPick("Pick one to continue.");
  if(step === "matching")   return state.matching !== null ? alertPickClear() : alertPick("Pick one to continue.");
  if(step === "expertise")  return state.expertise.length ? alertPickClear() : alertPick("Pick at least one.");

  if(step === "school"){
    let ok = true;
    state.school = v("school"); state.grade = v("grade");
    if(!state.school) ok = fail("school","Enter your school name.");
    if(!state.grade)  ok = fail("grade","Select the grade you'll be in this fall.");
    return ok;
  }
  if(step === "teamdetails"){
    state.teamName = v("teamName"); state.teammates = v("teammates");
    if(!state.teamName) return fail("teamName","Give your team a name — anything works.");
    const bad = state.teammates.split(/[\n,]/).map(s=>s.trim()).filter(Boolean)
                  .filter(e=>!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e));
    if(bad.length) return fail("teammates",`Not a valid email: ${bad[0]}`);
    return true;
  }
  if(step === "org"){
    state.org = v("org");
    if(!state.org) return fail("org","Tell us your company or role.");
    return true;
  }
  if(step === "contact"){
    let ok = true;
    state.name = v("name"); state.email = v("email");
    if(!state.name) ok = fail("name","Enter your full name.");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(state.email))
      ok = fail("email", state.email ? "That email address isn't valid." : "Enter your email.");
    return ok;
  }
  return true;
}

/* inline notice for option screens (no field to hang an error on) */
let notice = null;
function alertPick(msg){
  const opts = document.querySelector(".opts");
  if(opts && !notice){
    notice = document.createElement("p");
    notice.className = "err show";
    notice.style.marginBottom = "18px";
    notice.textContent = msg;
    opts.after(notice);
  }
  return false;
}
function alertPickClear(){ notice?.remove(); notice = null; return true; }

/* ---------- submit ---------- */
async function submit(){
  const btn = document.getElementById("next");
  btn.disabled = true;
  btn.textContent = "Submitting…";

  const payload = { ...state, submittedAt:new Date().toISOString() };

  try{
    if(SUBMIT_ENDPOINT){
      const res = await fetch(SUBMIT_ENDPOINT,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload)
      });
      if(!res.ok) throw new Error(res.status);
    } else {
      console.log("Signup (no endpoint set):", payload);
      await new Promise(r=>setTimeout(r,450));
    }
    card.innerHTML = screens.done();
  }catch(err){
    btn.disabled = false;
    btn.textContent = "Submit signup";
    alertPick("That didn't send. Check your connection and try again.");
  }
}

/* ---------- render + wiring ---------- */
function render(){
  notice = null;
  const step = steps()[idx];
  card.innerHTML = (step === "intro" ? "" : meter()) + screens[step]();
  if(step !== "intro") placeDot();

  card.querySelectorAll(".opt").forEach(b=>{
    b.addEventListener("click", ()=>{
      const key = b.dataset.key;
      let val = b.dataset.val;
      if(val === "true") val = true;
      if(val === "false") val = false;

      if(key === "expertise"){
        state.expertise = state.expertise.includes(val)
          ? state.expertise.filter(x=>x!==val)
          : [...state.expertise, val];
        b.setAttribute("aria-pressed", state.expertise.includes(val));
      } else {
        state[key] = val;
        card.querySelectorAll(`.opt[data-key="${key}"]`)
            .forEach(o=>o.setAttribute("aria-pressed", o===b));
      }
      alertPickClear();
    });
  });

  document.getElementById("next")?.addEventListener("click", ()=>{
    if(step === "review") return submit();
    if(!validate(step)) return;
    idx++;
    render();
  });

  document.getElementById("back")?.addEventListener("click", ()=>{
    idx = Math.max(0, idx-1);
    render();
  });

  card.querySelector("input,select,textarea")?.focus({preventScroll:true});
}

/* Enter advances from text fields */
document.addEventListener("keydown", e=>{
  if(e.key === "Enter" && e.target.tagName !== "TEXTAREA"){
    const n = document.getElementById("next");
    if(n && !n.disabled){ e.preventDefault(); n.click(); }
  }
});

render();
</script>
